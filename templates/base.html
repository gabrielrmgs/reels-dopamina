<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" />
    <style>
      /* Esqueleto de Reels 1080x1920. Troque os tokens pelos do perfil de marca (brands/<marca>.md).
         Cada <section class="scene clip"> é uma cena; elas podem se sobrepor para transições fluidas. */
      :root {
        --primary: #2563eb; --navy: #0b1b4d; --navy-2: #0f2a6b; --cream: #f4f6fa; --ink: #0f172a;
        --muted: #64748b; --border: #e2e8f0; --emerald: #059669; --mint: #34d399; --rose: #f43f5e;
        --red: #dc2626; --gold: #fbbf24;
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-display: "Outfit", ui-sans-serif, system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05070d; font-family: var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #05070d; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .blob { position: absolute; border-radius: 50%; }

      /* Texto cinético (fx.splitWords + fx.words) */
      .kt { position: absolute; left: 60px; right: 60px; font-family: var(--font-display); font-weight: 800; font-size: 100px; line-height: 1.04; letter-spacing: -0.025em; text-align: center; color: var(--ink); }
      .kt .w { display: inline-block; white-space: nowrap; }
      .kt .hl { color: var(--primary); }
      .kt .bad { color: var(--rose); }
      .kt .ul { position: relative; isolation: isolate; }
      .kt .ul .bar { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 14px; border-radius: 8px; background: var(--mint); transform-origin: left center; z-index: -1; }
      .kt.light { color: #fff; text-shadow: 0 6px 30px rgb(0 0 0 / 0.45); }
      .kt.light .hl { color: var(--mint); }

      /* Celular: prints 1170x2532 encaixam com width 568px */
      .phone { position: absolute; width: 600px; height: 1261px; border-radius: 76px; background: #0b1220; padding: 16px; box-shadow: 0 60px 120px -30px rgb(0 0 0 / 0.6), 0 0 0 3px #1e293b inset; }
      .phone .screen { position: relative; width: 568px; height: 1229px; border-radius: 62px; overflow: hidden; background: #f8fafc; }
      .phone .screen > img { position: absolute; left: 0; top: 0; width: 568px; display: block; }
      .phone .island { position: absolute; top: 30px; left: 50%; width: 150px; height: 40px; margin-left: -75px; border-radius: 22px; background: #0b1220; z-index: 5; }

      /* Cards que "saltam" da tela */
      .pop { position: absolute; background: #fff; border: 1px solid var(--border); border-radius: 28px; box-shadow: 0 30px 70px -18px rgb(15 23 42 / 0.35); padding: 26px 32px; }
      .pop .meta { font-size: 22px; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; }
      .pop .big { font-family: var(--font-display); font-weight: 900; font-size: 64px; letter-spacing: -0.02em; }
      .check { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: var(--emerald); box-shadow: 0 10px 24px -6px rgb(5 150 105 / 0.6); display: flex; align-items: center; justify-content: center; }
      .check::after { content: ""; width: 24px; height: 12px; border-left: 6px solid #fff; border-bottom: 6px solid #fff; transform: translateY(-4px) rotate(-45deg); }

      /* Peças dos efeitos do fx.js */
      .conf { position: absolute; width: 16px; height: 26px; border-radius: 3px; opacity: 0; }
      .ray { position: absolute; width: 1400px; height: 12px; margin-top: -6px; transform-origin: 0 50%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.5)); opacity: 0; }
      .rain { position: absolute; font-size: 90px; opacity: 0; }
      .wordmark { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="reel" data-start="0" data-duration="12" data-width="1080" data-height="1920">

      <!-- Hook (0–3 s): substitua pelo hook escolhido no roteiro -->
      <section id="s1" class="scene clip" data-start="0" data-duration="4.2" style="background:radial-gradient(circle at 50% 35%,#3b0a0a,#0a0505 75%)">
        <div id="s1-rays"></div>
        <div class="kt light" id="s1-kt" data-text="Frase do *hook* aqui" style="top:760px;font-size:130px"></div>
      </section>

      <!-- Solução: celular com tela real + card que salta -->
      <section id="s2" class="scene clip" data-start="3.8" data-duration="4.6" style="background:var(--cream)">
        <div class="blob" id="s2-blob" style="width:1600px;height:1600px;left:300px;top:1050px;background:var(--primary)"></div>
        <div class="kt" id="s2-kt" data-text="Benefício *em* *poucas* palavras" style="top:220px;font-size:96px"></div>
        <div class="phone" id="s2-phone" style="left:240px;top:560px"><div class="island"></div><div class="screen"><!-- <img src="assets/tela.png" /> --></div></div>
        <div class="pop" id="s2-pop" style="left:60px;top:1250px;width:520px"><div class="meta">RESULTADO</div><div class="big" id="s2-val" style="color:var(--emerald)">R$ 0</div><div class="check" style="right:-22px;top:-26px"></div></div>
        <div id="s2-conf"></div>
      </section>

      <!-- CTA -->
      <section id="se" class="scene clip" data-start="8.2" data-duration="3.8" style="background:linear-gradient(180deg,var(--navy),#071233)">
        <div id="se-logo" style="position:absolute;left:0;right:0;top:520px;text-align:center;color:#fff"><span class="wordmark" style="font-size:120px">MARCA</span></div>
        <div id="se-offer" style="position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:880px;background:var(--mint);color:var(--navy);font-family:var(--font-display);font-weight:900;font-size:76px;padding:22px 56px;border-radius:28px;transform:rotate(-3deg)">OFERTA</div>
        <div id="se-url" style="position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:1110px;background:var(--primary);color:#fff;font-family:var(--font-display);font-weight:700;font-size:60px;padding:26px 64px;border-radius:999px;white-space:nowrap">site.com.br</div>
        <div id="se-conf"></div>
      </section>

      <div id="fx-flash" style="position:absolute;inset:0;background:#fff;opacity:0;z-index:50;pointer-events:none"></div>
      <div id="fx-progress" style="position:absolute;left:0;top:0;width:1080px;height:10px;background:var(--mint);transform-origin:left center;z-index:60"></div>

      <!-- Áudio: adicione aqui as tags de áudio (cada uma com id único, escrita no HTML, nunca por JS).
           Narração: id="vo", src="assets/voz-final.mp3", data-start = V, data-volume="1".
           Trilha:   id="bgm", data-start = (virada + V) - drop, data-volume="0.16", data-fade-out="1.2".
           Efeitos:  id="sfx-...", data-duration curto; ~10 dB abaixo da voz quando tocam juntos. -->
    </div>

    <script src="fx.js"></script>
    <script>
      const TOTAL = 12;
      const tl = gsap.timeline({ paused: true });
      const fx = createFx(tl, { seed: 7 });
      fx.splitWords();
      fx.progress(TOTAL);
      tl.set(["#s2", "#se"], { opacity: 0 }, 0);

      /* Hook */
      fx.rays("s1-rays", 0.1, 16, 3.5, 40);
      tl.fromTo("#s1-kt .w", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out", stagger: 0.15 }, 0.3);
      fx.shake("#s1", 0.6, 22);

      /* Transição fluida → solução */
      fx.zoomThrough("#s1", "#s2", 3.8);
      fx.words("#s2-kt", 4.0);
      tl.fromTo("#s2-phone", { y: 1300 }, { y: 0, duration: 0.8, ease: "expo.out" }, 4.1);
      fx.popIn("#s2-pop", 5.4, { x: -150 });
      fx.count(document.getElementById("s2-val"), 0, 6600, 5.5, 1.0);
      fx.checkIn("#s2-pop .check", 6.4);
      fx.confetti("s2-conf", 6.5, 320, 1250, 46, 1000);

      /* CTA */
      fx.circleIn("#se", 8.2);
      tl.to("#se", { opacity: 1, duration: 0.01 }, 8.2);
      fx.popIn("#se-logo", 8.4);
      tl.fromTo("#se-offer", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 8.7);
      fx.confetti("se-conf", 8.9, 540, 960, 50, 1000);
      fx.popIn("#se-url", 9.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["reel"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
